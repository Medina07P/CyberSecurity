version: '3.8'

services:
  ctf-toolkit:
    build: .
    container_name: ctf_toolkit
    volumes:
      - ../../:/opt/ctf-toolkit
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    stdin_open: true
    tty: true
    command: /bin/bash
